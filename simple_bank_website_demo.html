<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Amazon Clone</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { margin: 0; background: #eaeded; }

    /* HEADER */
    header {
      background: #131921;
      color: white;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .logo { color: #ff9900; font-size: 1.6rem; font-weight: bold; }
    .search { flex: 1; display: flex; }
    .search input { width: 100%; padding: 10px; border: none; }
    .search button { padding: 10px 16px; border: none; background: #febd69; cursor: pointer; }
    .cart { font-weight: bold; cursor: pointer; }

    /* PRODUCTS */
    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      padding: 15px;
      border-radius: 6px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,.15);
    }

    .product img { width: 100%; height: 160px; object-fit: cover; }
    .product h3 { font-size: 1rem; }
    .price { color: #b12704; font-weight: bold; }

    button.add {
      background: #ffd814;
      border: 1px solid #fcd200;
      padding: 8px;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
      border-radius: 4px;
      font-weight: bold;
    }

    /* CART */
    .cart-box {
      background: white;
      max-width: 1200px;
      margin: auto;
      padding: 20px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,.15);
      margin-bottom: 30px;
    }

    .cart-item { display: flex; justify-content: space-between; margin: 10px 0; }
    .total { font-weight: bold; font-size: 1.2rem; }

    .buy {
      background: #ffa41c;
      border: none;
      padding: 10px;
      cursor: pointer;
      width: 100%;
      border-radius: 4px;
      font-weight: bold;
      margin-top: 10px;
    }

    footer { background: #131921; color: white; text-align: center; padding: 12px; }
  </style>
</head>
<body>

<header>
  <div class="logo">amazon</div>
  <div class="search">
    <input placeholder="Search Amazon">
    <button>Search</button>
  </div>
  <div class="cart">🛒 Cart: <span id="cartCount">0</span></div>
</header>

<div class="container">
  <div class="product">
    <img src="https://via.placeholder.com/200">
    <h3>Wireless Headphones</h3>
    <p class="price">₹1999</p>
    <button class="add" onclick="addToCart('Wireless Headphones',1999)">Add to Cart</button>
  </div>

  <div class="product">
    <img src="https://via.placeholder.com/200">
    <h3>Smart Watch</h3>
    <p class="price">₹2499</p>
    <button class="add" onclick="addToCart('Smart Watch',2499)">Add to Cart</button>
  </div>

  <div class="product">
    <img src="https://via.placeholder.com/200">
    <h3>Bluetooth Speaker</h3>
    <p class="price">₹1299</p>
    <button class="add" onclick="addToCart('Bluetooth Speaker',1299)">Add to Cart</button>
  </div>

  <div class="product">
    <img src="https://via.placeholder.com/200">
    <h3>Laptop Backpack</h3>
    <p class="price">₹999</p>
    <button class="add" onclick="addToCart('Laptop Backpack',999)">Add to Cart</button>
  </div>
</div>

<div class="cart-box">
  <h2>Your Cart</h2>
  <div id="cartItems"></div>
  <p class="total">Total: ₹<span id="total">0</span></p>
  <button class="buy" onclick="purchase()">Buy Now</button>
</div>

<footer>
  Simple Amazon Clone • Cart & Purchase Functional
</footer>

<script>
  let cart = [];

  function addToCart(name, price) {
    cart.push({ name, price });
    updateCart();
  }

  function updateCart() {
    const cartItems = document.getElementById('cartItems');
    const cartCount = document.getElementById('cartCount');
    const totalEl = document.getElementById('total');

    cartItems.innerHTML = '';
    let total = 0;

    cart.forEach(item => {
      total += item.price;
      cartItems.innerHTML += `<div class='cart-item'><span>${item.name}</span><span>₹${item.price}</span></div>`;
    });

    cartCount.textContent = cart.length;
    totalEl.textContent = total;
  }

  function purchase() {
    if (cart.length === 0) return alert('Cart is empty');
    alert('Purchase successful! Order placed.');
    cart = [];
    updateCart();
  }
</script>

</body>
</html>
